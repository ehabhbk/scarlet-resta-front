<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/scarlet.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>scarlet-resta</title>
    <script>
      // Apply the persisted theme before first paint to avoid a white flash.
      try {
        var saved = JSON.parse(localStorage.getItem('ui-storage') || '{}')
        if (saved && saved.state && saved.state.darkMode) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
